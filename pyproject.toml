[project]
name = "porchlight"
version = "0.1.0"
description = "Extreme-weather wellness check-in agent (Strands + AgentCore)"
requires-python = ">=3.12"
dependencies = [
    "strands-agents",
    "strands-agents-tools",
    "bedrock-agentcore",
    "bedrock-agentcore-starter-toolkit",
    "supabase",
    "twilio",
    "boto3",
    "pydantic",
    "pyyaml",
    "pytest",
    "python-dotenv",
    "httpx",
    "google-api-python-client",
    "psycopg[binary]",
]
